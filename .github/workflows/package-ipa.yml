name: Package IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "IPA 版本号（用于文件名、工件名与 Release tag）"
        required: false
        default: "0.9.3"

permissions:
  contents: write

concurrency:
  group: package-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-ipa:
    name: Build unsigned IPA & upload artifact
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::未在 /Applications 找到 Xcode"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos' || {
            echo "::error::缺少 iOS SDK"
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix project.yml encoding
        run: |
          if iconv -f UTF-8 -t UTF-8 project.yml >/dev/null 2>&1; then
            echo "project.yml already valid UTF-8"
          elif iconv -f GB18030 -t UTF-8 project.yml > project.yml.tmp 2>/dev/null && [ -s project.yml.tmp ]; then
            mv project.yml.tmp project.yml
            echo "project.yml converted to UTF-8"
          else
            rm -f project.yml.tmp
            echo "::warning::could not normalize project.yml encoding"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: AIVideoPlayer/Resources/Models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.sh', 'scripts/whisperkit-tiny.manifest') }}

      - name: Build for iOS device (unsigned Release)
        run: |
          xcodebuild build \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="AIVideoPlayer-${{ inputs.version }}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoPlayer-${{ inputs.version }}-unsigned
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release and upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          TAG="AIVideoPlayer-${VERSION}-unsigned"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "AIVideoPlayer v${VERSION} (unsigned IPA)" \
              --notes "未签名 IPA，供 Sideloadly / AltStore / 爱思助手等自签工具使用。"
          fi