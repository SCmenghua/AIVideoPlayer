name: Package IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "IPA 版本号（用于文件名、工件名与 Release tag）"
        required: false
        default: "0.8.6"

permissions:
  contents: write

concurrency:
  group: package-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-ipa:
    name: Build unsigned IPA & upload artifact
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::未在 /Applications 找到 Xcode"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos' || {
            echo "::error::缺少 iOS SDK"
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: AIVideoPlayer/Resources/Models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.sh', 'scripts/whisperkit-tiny.manifest') }}

      - name: Build for iOS device (unsigned Release)
        run: |
          xcodebuild build \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="AIVideoPlayer-${{ inputs.version }}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoPlayer-${{ inputs.version }}-unsigned
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release and upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          TAG="AIVideoPlayer-${VERSION}-unsigned"
          cat > RELEASE_NOTES.md <<EOF
          ## AIVideoPlayer v${VERSION}（未签名 IPA）

          - 供自签工具使用：Sideloadly / AltStore / 爱思助手 等，导入 IPA 后用自己的 Apple ID 签名安装。
          - 需要 iOS 26 及以上设备。
          - Phase 8.1：识别可用性修复——标准 prefill + 语言传递（中文识别更稳）、
            识别游标跟随播放位置并跳过落后窗口；设置页新增识别状态统计。
          - Phase 8.0：修复 AI 字幕无输出问题（播放器字幕开关联动识别管线、
            播放中途激活用真实播放时间重建游标、模型加载期识别循环自动重试）。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "AIVideoPlayer v${VERSION} (unsigned IPA)" \
              --notes-file RELEASE_NOTES.md
          fi
