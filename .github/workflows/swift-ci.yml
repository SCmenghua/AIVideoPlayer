name: Swift CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS 26)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::鏈湪 /Applications 鎵惧埌 Xcode"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos' || {
            echo "::error::缂哄皯 iOS SDK"
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix project.yml encoding
        run: |
          iconv -f UTF-8 -t UTF-8 project.yml 2>/dev/null || cat project.yml > /tmp/project.yml.tmp && mv /tmp/project.yml.tmp project.yml
          echo "project.yml encoding fixed"
      - name: Fix project.yml encoding
        run: |
          iconv -f UTF-8 -t UTF-8 project.yml 2>/dev/null || cat project.yml > /tmp/project.yml.tmp && mv /tmp/project.yml.tmp project.yml
          echo "project.yml encoding fixed"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: AIVideoPlayer/Resources/Models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.sh', 'scripts/whisperkit-tiny.manifest') }}

      - name: Build (iOS Simulator, no signing)
        run: |
          xcodebuild build \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve test simulator
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -n 1 | xargs)
          if [ -z "$SIM_NAME" ]; then
            echo "::error::娌℃湁鍙敤鐨?iPhone 妯℃嫙鍣?
            exit 1
          fi
          echo "Test simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO


