name: Swift CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS 26)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::未在 /Applications 找到 Xcode"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos' || {
            echo "::error::缺少 iOS SDK"
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix project.yml encoding
        run: |
          if iconv -f UTF-8 -t UTF-8 project.yml >/dev/null 2>&1; then
            echo "project.yml already valid UTF-8"
          elif iconv -f GB18030 -t UTF-8 project.yml > project.yml.tmp 2>/dev/null && [ -s project.yml.tmp ]; then
            mv project.yml.tmp project.yml
            echo "project.yml converted to UTF-8"
          else
            rm -f project.yml.tmp
            echo "::warning::could not normalize project.yml encoding"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: AIVideoPlayer/Resources/Models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.sh', 'scripts/whisperkit-tiny.manifest') }}

      - name: Build (iOS Simulator, no signing)
        run: |
          xcodebuild build \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve test simulator
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -Eo 'iPhone [^(]+' | head -n 1 | xargs)
          if [ -z "$SIM_NAME" ]; then
            echo "::error::没有可用的 iPhone 模拟器"
            exit 1
          fi
          echo "Test simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA (device Release)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          xcodebuild build \
            -project AIVideoPlayer.xcodeproj \
            -scheme AIVideoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          echo "App version: $VERSION"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA_NAME="AIVideoPlayer-${VERSION}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Create GitHub Release and upload IPA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="AIVideoPlayer-${VERSION}-unsigned"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "AIVideoPlayer v${VERSION} (unsigned IPA)" \
              --notes "自动构建自 commit ${{ github.sha }}"
          fi